<!DOCTYPE html>

<html dir="rtl" lang="ar"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f8f9ff;}body{overscroll-behavior:none;direction:rtl;text-align:right;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-lowest": "#ffffff", "tertiary-fixed": "#a6f4b5", "on-primary-fixed-variant": "#004d64", "secondary-fixed-dim": "#bdc7d8", "inverse-on-surface": "#eaf1ff", "on-primary": "#ffffff", "tertiary-container": "#287340", "on-secondary": "#ffffff", "tertiary": "#025a2a", "on-background": "#121c2a", "surface-tint": "#006684", "surface-dim": "#d0dbed", "secondary-container": "#d6e0f1", "on-primary-container": "#c1eaff", "on-surface-variant": "#3f484d", "inverse-primary": "#85d0f2", "surface-container-low": "#eff4ff", "surface": "#f8f9ff", "primary": "#00556d", "outline-variant": "#bfc8cd", "on-tertiary-fixed-variant": "#005226", "tertiary-fixed-dim": "#8bd79b", "surface-container-high": "#dee9fc", "surface-bright": "#f8f9ff", "primary-fixed-dim": "#85d0f2", "on-secondary-container": "#596372", "on-error-container": "#93000a", "secondary-fixed": "#d9e3f4", "on-tertiary": "#ffffff", "surface-container-highest": "#d9e3f6", "primary-fixed": "#bde9ff", "on-primary-fixed": "#001f2a", "error": "#ba1a1a", "on-surface": "#121c2a", "background": "#f8f9ff", "on-tertiary-container": "#a8f6b6", "on-tertiary-fixed": "#00210b", "error-container": "#ffdad6", "inverse-surface": "#27313f", "outline": "#6f787e", "surface-container": "#e6eeff", "secondary": "#555f6d", "on-secondary-fixed-variant": "#3e4755", "surface-variant": "#d9e3f6", "on-secondary-fixed": "#121c28", "on-error": "#ffffff", "primary-container": "#0f6e8c" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1rem", "margin": "1.25rem", "space-lg": "1.5rem", "space-xl": "2rem", "space-md": "1rem", "space-sm": "0.5rem", "space-xs": "0.25rem" }, "fontFamily": { "label-lg": ["Noto Sans"], "body-lg": ["Noto Sans"], "label-sm": ["Noto Sans"], "headline-lg": ["Noto Sans"], "label-md": ["Noto Sans"], "headline-sm": ["Noto Sans"], "headline-md": ["Noto Sans"], "body-md": ["Noto Sans"] }, "fontSize": { "label-lg": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "30px", "fontWeight": "400" }], "label-sm": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-lg": ["24px", { "lineHeight": "36px", "fontWeight": "700" }], "label-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "headline-sm": ["18px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "32px", "fontWeight": "700" }], "body-md": ["16px", { "lineHeight": "26px", "fontWeight": "400" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="رجوع" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-primary-container focus:outline-none" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold">Schedule Slot Selection</h2></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-6 text-right" dir="rtl">
<!-- Introductory Area -->
<div class="mb-space-lg pt-2">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb- space-xs">اختر العيادة المطلوبة</h1>
<p class="font-body-lg text-body-lg text-secondary">يرجى تحديد العيادة لحجز موعدك الطبي</p>
</div>
<!-- Clinic Options List -->
<div aria-label="قائمة العيادات الطبية" class="flex flex-col gap-space-md mb-space-xl" role="radiogroup">
<!-- Option 1: Selected Default -->
<div aria-checked="true" class="clinic-card cursor-pointer bg-surface-container-lowest p-[20px] rounded-lg transition-colors duration-150 flex items-start justify-between border-2 border-primary-container" id="clinic-1" onclick="selectClinic('clinic-1')" role="radio" tabindex="0">
<div class="flex flex-col flex-1 pl-space-sm">
<span class="font-headline-sm text-headline-sm text-on-surface mb- space-xs">عيادة طب الأسرة</span>
<span class="font-body-md text-body-md text-secondary">الرعاية الأولية، الفحوصات الدورية، ومتابعة الأمراض المزمنة</span>
</div>
<div class="radio-indicator mt-1 flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center bg-primary-container">
<span class="w-2.5 h-2.5 rounded-full bg-surface-container-lowest"></span>
</div>
</div>
<!-- Option 2 -->
<div aria-checked="false" class="clinic-card cursor-pointer bg-surface-container-lowest p-[20px] rounded-lg transition-colors duration-150 flex items-start justify-between border border-outline-variant" id="clinic-2" onclick="selectClinic('clinic-2')" role="radio" tabindex="0">
<div class="flex flex-col flex-1 pl-space-sm">
<span class="font-headline-sm text-headline-sm text-on-surface mb- space-xs">عيادة طب وجراحة العيون</span>
<span class="font-body-md text-body-md text-secondary">فحص النظر، أمراض القرنية، وضغط العين</span>
</div>
<div class="radio-indicator mt-1 flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center bg-surface-container-lowest border border-outline-variant">
<span class="w-2.5 h-2.5 rounded-full bg-transparent"></span>
</div>
</div>
<!-- Option 3 -->
<div aria-checked="false" class="clinic-card cursor-pointer bg-surface-container-lowest p-[20px] rounded-lg transition-colors duration-150 flex items-start justify-between border border-outline-variant" id="clinic-3" onclick="selectClinic('clinic-3')" role="radio" tabindex="0">
<div class="flex flex-col flex-1 pl-space-sm">
<span class="font-headline-sm text-headline-sm text-on-surface mb- space-xs">عيادة طب وجراحة الأسنان</span>
<span class="font-body-md text-body-md text-secondary">علاج وجراحة الأسنان، تقويم الأسنان، واللثة</span>
</div>
<div class="radio-indicator mt-1 flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center bg-surface-container-lowest border border-outline-variant">
<span class="w-2.5 h-2.5 rounded-full bg-transparent"></span>
</div>
</div>
</div>
<!-- Bottom Action -->
<div class="mt-auto pt-space-md">
<button class="w-full h-[56px] rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center active:bg-primary transition-colors focus:outline-none" type="button">
      متابعة لاختيار الطبيب
    </button>
</div>
</div>
<script>
  function selectClinic(id) {
    const cards = document.querySelectorAll('.clinic-card');
    cards.forEach((card) => {
      const isSelected = card.id === id;
      card.setAttribute('aria-checked', isSelected ? 'true' : 'false');
      
      const indicator = card.querySelector('.radio-indicator');
      const innerDot = indicator.querySelector('span');

      if (isSelected) {
        card.classList.remove('border', 'border-outline-variant');
        card.classList.add('border-2', 'border-primary-container');
        
        indicator.className = 'radio-indicator mt-1 flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center bg-primary-container';
        innerDot.className = 'w-2.5 h-2.5 rounded-full bg-surface-container-lowest';
      } else {
        card.classList.remove('border-2', 'border-primary-container');
        card.classList.add('border', 'border-outline-variant');
        
        indicator.className = 'radio-indicator mt-1 flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center bg-surface-container-lowest border border-outline-variant';
        innerDot.className = 'w-2.5 h-2.5 rounded-full bg-transparent';
      }
    });
  }
</script></main></body></html>
