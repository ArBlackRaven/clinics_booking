<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

v></div></header><main class="flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-6">
<!-- Clinic Context Header Badge -->
<div class="mb-4">
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-surface-container text-on-surface-variant">
<span class="material-symbols-outlined text-[18px] text-primary-container">medical_services</span>
<span class="font-label-sm text-label-sm font-semibold">عيادة طب الأسرة</span>
</div>
</div>
<!-- Screen Heading -->
<div class="flex flex-col gap-1 mb-6">
<h1 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight">
      اختر الطبيب المعالج
    </h1>
<p class="font-body-lg text-body-lg text-secondary">
      الأطباء المتاحون للحجز هذا الأسبوع
    </p>
</div>
<!-- Medical Service Mode Selection (Delightful Institutional Micro-Tabs) -->
<div class="grid grid-cols-2 gap-2 mb-6 p-1 rounded-xl bg-surface-container-high">
<button class="py-2.5 px-3 rounded-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md text-center transition-colors font-semibold" id="tab-in-person" type="button">
      كشف حضوري بالمركز
    </button>
<button class="py-2.5 px-3 rounded-lg text-secondary hover:text-on-surface font-label-md text-label-md text-center transition-colors" id="tab-telehealth" type="button">
      استشارة عن بُعد
    </button>
</div>
<!-- Doctors Selection Cards List -->
<fieldset aria-label="قائمة الأطباء المتاحين" class="flex flex-col gap-3 m-0 p-0 border-0"><label class="doctor-card relative flex items-center justify-between p-4 rounded-lg bg-surface-container-lowest cursor-pointer transition-all border-2 border-primary-container shadow-sm" data-doctor="1"><input checked="" class="sr-only" name="selected_doctor" type="radio" value="dr-khaled"><div class="flex items-center gap-3 min-w-0 flex-1"><div class="flex-shrink-0 w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl select-none" style="background-color: rgb(230, 241, 245); color: rgb(15, 110, 140);">خ</div><div class="flex flex-col min-w-0 flex-1"><div class="flex items-center gap-2 mb-1 flex-wrap"><span class="font-headline-sm text-headline-sm text-on-surface font-bold truncate">د. خالد بن عبد الله المنصور</span><span class="px-2 py-0.5 rounded bg-tertiary-fixed text-on-tertiary-fixed-variant font-label-sm text-label-sm font-semibold flex-shrink-0">متاح اليوم</span></div><span class="font-body-md text-body-md text-secondary mb-1.5 truncate">استشاري طب الأسرة والمجتمع</span><div class="flex items-center gap-2 text-on-surface-variant font-label-sm text-label-sm"><span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-primary-container">work_history</span><span class="">خبرة 14 سنة</span></span><span class="text-outline-variant">•</span><span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-primary-container">payments</span><span class="font-semibold text-on-surface">150 ر.س</span></span></div></div></div><div class="radio-indicator flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center border-2 border-primary-container bg-primary-container text-on-primary mr-2"><span class="material-symbols-outlined text-[16px] font-bold">check</span></div></label><label class="doctor-card relative flex items-center justify-between p-4 rounded-lg bg-surface-container-lowest cursor-pointer transition-all border border-outline-variant/50 hover:bg-surface-container-low shadow-sm" data-doctor="2"><input class="sr-only" name="selected_doctor" type="radio" value="dr-sara"><div class="flex items-center gap-3 min-w-0 flex-1"><div class="flex-shrink-0 w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl select-none" style="background-color: rgb(230, 241, 245); color: rgb(15, 110, 140);">س</div><div class="flex flex-col min-w-0 flex-1"><div class="flex items-center gap-2 mb-1 flex-wrap"><span class="font-headline-sm text-headline-sm text-on-surface font-bold truncate">د. سارة بنت فهد القحطاني</span><span class="px-2 py-0.5 rounded bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm flex-shrink-0">متاح غداً</span></div><span class="font-body-md text-body-md text-secondary mb-1.5 truncate">أخصائية أولى في طب الأسرة</span><div class="flex items-center gap-2 text-on-surface-variant font-label-sm text-label-sm"><span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-primary-container">work_history</span><span class="">خبرة 9 سنوات</span></span><span class="text-outline-variant">•</span><span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-primary-container">payments</span><span class="font-semibold text-on-surface">120 ر.س</span></span></div></div></div><div class="radio-indicator flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center border-2 border-outline bg-surface-container-lowest text-transparent mr-2"><span class="material-symbols-outlined text-[16px] font-bold">check</span></div></label><label class="doctor-card relative flex items-center justify-between p-4 rounded-lg bg-surface-container-lowest cursor-pointer transition-all border border-outline-variant/50 hover:bg-surface-container-low shadow-sm" data-doctor="3"><input class="sr-only" name="selected_doctor" type="radio" value="dr-omar"><div class="flex items-center gap-3 min-w-0 flex-1"><div class="flex-shrink-0 w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl select-none" style="background-color: rgb(230, 241, 245); color: rgb(15, 110, 140);">ع</div><div class="flex flex-col min-w-0 flex-1"><div class="flex items-center gap-2 mb-1 flex-wrap"><span class="font-headline-sm text-headline-sm text-on-surface font-bold truncate">د. عمر بن يوسف الصالح</span><span class="px-2 py-0.5 rounded bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm flex-shrink-0">متاح الأربعاء</span></div><span class="font-body-md text-body-md text-secondary mb-1.5 truncate">نائب أول - الفحص الشامل والوقائي</span><div class="flex items-center gap-2 text-on-surface-variant font-label-sm text-label-sm"><span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-primary-container">work_history</span><span class="">خبرة 11 سنة</span></span><span class="text-outline-variant">•</span><span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-primary-container">payments</span><span class="font-semibold text-on-surface">130 ر.س</span></span></div></div></div><div class="radio-indicator flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center border-2 border-outline bg-surface-container-lowest text-transparent mr-2"><span class="material-symbols-outlined text-[16px] font-bold">check</span></div></label></fieldset>
<!-- Reassurance Micro-banner -->
<div class="flex items-center gap-3 p-3.5 my-6 rounded-lg bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-primary-container text-[20px] flex-shrink-0">verified_user</span>
<span class="font-label-sm text-label-sm leading-normal">
      جميع الأطباء معتمدون ومصنفون من الهيئة السعودية للتخصصات الصحية.
    </span>
</div>
<!-- Primary Sticky / Anchored CTA Section -->
<div class="w-full mt-auto pt-2">
<button class="w-full h-14 rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 active:bg-primary transition-colors focus:outline-none" id="submit-btn" type="button">
<span class="">متابعة لتحديد الموعد</span>
<span class="material-symbols-outlined text-[20px] rotate-180">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function() {
    const cards = document.querySelectorAll('.doctor-card');
    
    cards.forEach(card => {
      const radio = card.querySelector('input[type="radio"]');
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.classList.remove('border-2', 'border-primary-container');
          c.classList.add('border', 'border-outline-variant/50');
          const indicator = c.querySelector('.radio-indicator');
          indicator.classList.remove('border-primary-container', 'bg-primary-container', 'text-on-primary');
          indicator.classList.add('border-outline', 'bg-surface-container-lowest', 'text-transparent');
        });

        card.classList.remove('border', 'border-outline-variant/50');
        card.classList.add('border-2', 'border-primary-container');
        const activeIndicator = card.querySelector('.radio-indicator');
        activeIndicator.classList.remove('border-outline', 'bg-surface-container-lowest', 'text-transparent');
        activeIndicator.classList.add('border-primary-container', 'bg-primary-container', 'text-on-primary');
        radio.checked = true;
      });
    });

    const inPersonTab = document.getElementById('tab-in-person');
    const telehealthTab = document.getElementById('tab-telehealth');
    
    if (inPersonTab && telehealthTab) {
      telehealthTab.addEventListener('click', () => {
        telehealthTab.classList.add('bg-surface-container-lowest', 'text-on-surface', 'font-semibold');
        telehealthTab.classList.remove('text-secondary');
        inPersonTab.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'font-semibold');
        inPersonTab.classList.add('text-secondary');
      });

      inPersonTab.addEventListener('click', () => {
        inPersonTab.classList.add('bg-surface-container-lowest', 'text-on-surface', 'font-semibold');
        inPersonTab.classList.remove('text-secondary');
        telehealthTab.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'font-semibold');
        telehealthTab.classList.add('text-secondary');
      });
    }
  })();
</script></main>

</body></html>
